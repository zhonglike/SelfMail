name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography dkimpy
      - name: 语法检查
        run: python -m compileall -q selfmail tests
      - name: 端到端冒烟测试（59 项）
        run: python tests/smoke_test.py
